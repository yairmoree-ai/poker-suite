<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="UTF-8"></head>
<body>
<div id="lock-screen" style="display:flex">
  <button onclick="enterAsViewer()">viewer</button>
</div>
<div id="app" style="display:none">
<div id="viewer-banner" style="display:none"></div>
<div id="topbar">
  <button id="btn-settings" onclick="toggleSettings()">⚙️</button>
  <span id="sync-dot"></span><span id="user-badge"></span>
  <button id="btn-upgrade-to-admin" style="display:none"></button>
  <button class="nav-tab active" id="tab-table" onclick="showView('table')">שולחן</button>
  <button class="nav-tab" id="tab-hands" onclick="showView('hands')">ידיים</button>
  <button class="nav-tab" id="tab-tourn" onclick="showView('tourn')">טורנירים</button>
  <button class="nav-tab" id="tab-players" onclick="showView('players')">שחקנים</button>
  <button id="btn-active"></button>
  <button id="btn-viewer-refresh" style="display:none"></button>
  <div id="statsbar">
    <input id="inp-buyin-cost" value="50">
    <select id="sel-table-size-stats"><option>2</option><option>6</option><option>9</option></select>
    <div id="stat-players">0</div><div id="stat-rebuys">0</div><div id="stat-entries">0</div>
    <div id="stat-active">0/0</div><div id="stat-prize">₪0</div>
    <div id="sbox-surprises" style="display:none"><div id="stat-surprises">₪0</div></div>
  </div>
</div>
<div id="main">
  <div id="live-actions-bar" style="display:none"></div>
  <div id="table-size-bar">
    <select id="sel-table-size"><option>2</option><option>6</option><option>9</option></select>
    <button id="btn-savehand"></button><button id="btn-resethand"></button>
  </div>
  <div id="table-view" style="display:flex">
    <div id="table-wrap">
      <svg id="table-svg" viewBox="0 0 100 100"></svg>
      <div id="seats-container"></div>
      <div id="board-center">
        <div id="board-cards"></div>
        <div id="pot-display" style="display:none"></div>
        <div id="showdown-banner" style="display:none"></div>
        <button id="blinds-btn"></button>
      </div>
    </div>
    <div id="pot-odds-bar" style="display:none"></div>
    <div class="panel" id="seat-panel"><div id="spt"></div><button id="btn-remove-seat" style="display:none"></button><div id="spb"></div></div>
    <div class="panel" id="blinds-panel"><div id="blinds-body"></div></div>
  </div>
  <div id="hands-view" style="display:none">
    <input id="hand-search"><select id="hand-filter-player"><option value=""></option></select>
    <div id="hands-stats-bar"></div><div id="hands-count"></div><div id="hand-list"></div>
  </div>
  <div id="tourn-view" style="display:none">
    <div id="timer-display">20:00</div><div id="timer-level"></div><div id="timer-blinds"></div><div id="timer-next"></div>
    <button id="btn-timer-toggle" onclick="toggleBlindTimer()">▶</button>
    <div id="timer-controls"></div>
    <div id="timer-progress"></div><div id="timer-prize-row"><span id="timer-prize"></span><span id="timer-active"></span><span id="timer-place1"></span></div>
    <button id="btn-save-tourn"></button><button id="btn-reset-tourn"></button>
    <div id="tourn-list"></div>
  </div>
  <div id="players-view" style="display:none">
    <button id="btn-addplayer"></button><button id="btn-export"></button><button id="btn-restore"></button>
    <div id="diag-box" style="display:none"></div>
    <div id="add-player-row"><input id="new-pname"></div>
    <div id="player-list"></div>
  </div>
</div>
</div>
<div id="card-picker"><div id="cpbox"><div id="cp-title"></div><button id="cp-camera-btn"></button><div id="cp-content"></div></div></div>
<div id="players-popup"><div id="pp-box"><div id="pp-content"></div></div></div>
<div id="overlay"></div>
<div id="notif"></div>
<div id="explosion-overlay"><div id="exp-bomb"><svg><text id="exp-bomb-num"></text></svg></div><svg id="exp-cloud"></svg><div id="exp-free"></div></div>
<div id="backup-box" style="display:none"><textarea id="backup-ta"></textarea></div>
<div id="import-box" style="display:none"><textarea id="import-ta"></textarea></div>
<div id="settings-box" style="display:none">
  <div id="viewer-url-row" style="display:none"><div id="viewer-url-display"></div></div>
  <input id="rebuy-default-inp" value="50000">
  <div id="gs-url-status"></div><div id="gs-url-edit-row" style="display:none"><input id="gs-url"></div>
  <div id="sync-status"></div>
  <button onclick="showStatistics()">📊 Statistics</button>
  <button onclick="showPotTrainer()">🎯 מאמן קופה — תרגול</button>
  <button id="btn-users-mgmt" onclick="showUsersManager()">👥 ניהול משתמשים</button>
  <button onclick="document.getElementById('settings-box').style.display='none'">סגור</button>
</div>
<div id="save-tourn-box" style="display:none"><input id="tourn-name-inp"></div>
<div id="stats-modal" style="display:none"><div id="stats-modal-content"></div></div>
<div id="pt-export-modal" style="display:none"><div id="pt-export-modal-content"></div></div>
<div id="drive-restore-box" style="display:none"><div id="drive-restore-content"></div></div>
<div id="merge-box" style="display:none"><div id="merge-list"></div></div>
<div id="trainer-modal" style="display:none;position:fixed;inset:0;z-index:600;background:rgba(0,0,0,0.88);align-items:center;justify-content:center;padding:16px">
  <div style="background:#121824;border-radius:16px;padding:18px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto">
    <button onclick="hidePotTrainer()">✕</button>
    <div id="trainer-modal-content"></div>
  </div>
</div>
<script src="auth.js"></script>
<script src="state.js"></script>
<script src="ranges.js"></script>
<script src="render.js"></script>
<script src="game.js"></script>
<script src="features.js"></script>
<script src="ui.js"></script>
<script src="trainer.js"></script>
</body></html>
